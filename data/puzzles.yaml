# philosophershq.com — The Signal puzzle data
#
# Structure:
#   puzzles:              # level 1 — top-level key
#     - puzzles:          # level 2 — array of groups; each group holds many puzzles
#         - puzzle_number: 1     # level 3 — array of puzzles
#           title: ...           # level 4 — fields of each puzzle
#           description: ...
#           is_about: ...
#           questions:
#             - question: ...
#               answer: ...
#
# Each puzzle has exactly three questions with three answers.
# Answers are normalized for comparison: lowercased, non-letter chars removed.
# Word-length structure of the answer (e.g., 4-letter word + 6-letter word)
# drives the per-letter box layout in the UI.

